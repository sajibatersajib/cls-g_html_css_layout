<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <title>simple_layout_design</title>
</head>
<body>
    <div class="box header"><h1>Header</h1></div>
    <div class="b">
        <div class="bb b1"><h1>First Part 1</h1></div>
        <div class="bb b2"><h1>First Part 2</h1></div>
    </div>
    <div class="c">
        <div class="cc c1"><h1>Second Part 1</h1></div>
        <div class="cc c2"><h1>Second Part 2</h1></div>
        <div class="cc c3"><h1>Second Part 3</h1></div>
    </div>
    <div class="d">
        <div class="dd d1"><h1>Fourth Part 1</h1></div>
        <div class="dd d2"><h1>Fourth Part 2</h1></div>
        <div class="dd d3"><h1>Fourth Part 3</h1></div>
        <div class="dd d4"><h1>Fourth Part 4</h1></div>
    </div>
    <div class="e">
        <div class="ee e1"><h1>Fifth Part 1</h1></div>
        <div class="ee e2"><h1>Fifth Part 2</h1></div>
        <div class="ee e3"><h1>Fifth Part 3</h1></div>
        <div class="ee e4"><h1>Fifth Part 4</h1></div>
        <div class="ee e5"><h1>Fifth Part 5</h1></div>
    </div>
    <div class="box footer">
        <h1>Footer</h1>
    </div>
</body>
</html>
